<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mouse Event Handling</title></head><body>
<div id="box" style="width:200px;height:200px;background:blue;"></div><div id="msg"></div>
<script>var b=document.getElementById('box');var m=document.getElementById('msg');b.onclick=function(){b.style.background='red';};b.onmouseover=function(){m.innerHTML='Mouse is over the box';};b.onmouseout=function(){m.innerHTML='';};</script>
</body></html>
