<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Gallery</title><style>
body{font-family:Arial,sans-serif;background:#fff;color:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.gallery-container{max-width:540px;width:100%;text-align:center;padding:20px;background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.1)}.instructions{color:#666;margin-bottom:20px;font-size:14px}img{width:100%;height:315px;object-fit:cover;border-radius:4px;border:1px solid #ddd}#message{margin-top:20px;font-size:18px;font-weight:bold;color:#007bff;height:24px}
</style></head><body><div class="gallery-container"><div class="instructions">Use Left/Right arrows to navigate. Press Enter to select.</div><img id="campusImg" src="../assets/campus-1.jpg" alt="Campus View"><div id="message"></div></div>
<script>const images=['../assets/campus-1.jpg','../assets/campus-2.jpg','https://picsum.photos/600/350?random=38'];let currentIndex=0;const campusImg=document.getElementById('campusImg');const message=document.getElementById('message');document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){currentIndex=(currentIndex+1)%images.length;campusImg.src=images[currentIndex];message.textContent='';}else if(event.key==='ArrowLeft'){currentIndex=(currentIndex-1+images.length)%images.length;campusImg.src=images[currentIndex];message.textContent='';}else if(event.key==='Enter'){message.textContent='Image Selected';}});</script></body></html>
