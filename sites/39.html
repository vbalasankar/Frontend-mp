<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Photo Gallery</title><style>
body{font-family:Arial,sans-serif;background:#fff;color:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.gallery-box{max-width:540px;width:100%;text-align:center;padding:20px;background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.1)}.controls-hint{color:#666;font-size:14px;margin-bottom:15px}img{width:100%;height:315px;object-fit:cover;border-radius:4px}#info{margin-top:20px;font-size:20px;font-weight:bold;color:#2c3e50;height:28px}
</style></head><body><div class="gallery-box"><div class="controls-hint">Press 'N' for Next, 'P' for Previous, 'Spacebar' for Destination Name</div><img id="galleryImg" src="../assets/travel-new-york.jpg" alt="Travel Destination"><div id="info"></div></div>
<script>const destinations=[{name:'Paris, France',url:'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=900'},{name:'Tokyo, Japan',url:'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=900'},{name:'New York, USA',url:'../assets/travel-new-york.jpg'}];let index=0;const galleryImg=document.getElementById('galleryImg');const info=document.getElementById('info');document.addEventListener('keydown',event=>{const key=event.key.toLowerCase();if(key==='n'){index=(index+1)%destinations.length;galleryImg.src=destinations[index].url;info.textContent='';}else if(key==='p'){index=(index-1+destinations.length)%destinations.length;galleryImg.src=destinations[index].url;info.textContent='';}else if(event.key===' '||event.code==='Space'){event.preventDefault();info.textContent=destinations[index].name;}});</script></body></html>
