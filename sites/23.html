<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Registration Form</title><style>
body{background:linear-gradient(to right,lightblue,white);font-family:Arial,sans-serif;}
form{width:500px;margin:30px auto;padding:25px;border:2px solid black;border-radius:15px;box-shadow:0 0 10px gray;background:white;}
h1{text-align:center}.form-group{display:flex;margin-bottom:15px;align-items:center}.form-group>label:first-child{width:180px;flex-shrink:0}
input,select,textarea{padding:8px;border:1px solid gray;border-radius:5px;max-width:100%;}input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=url],input[type=search],select,textarea{flex:1;min-width:0;}
textarea{resize:none}.buttons{text-align:center}.buttons input{margin:4px}
</style></head><body><form action="#" method="post" enctype="multipart/form-data"><h1>Patient Registration Form</h1>
<input type="hidden" name="patientid" value="P1001">
<div class="form-group"><label for="patient">Patient Name:</label><input id="patient" name="patient" type="text" required></div>
<div class="form-group"><label for="email">Email Address:</label><input id="email" name="email" type="email" required></div>
<div class="form-group"><label for="password">Password:</label><input id="password" name="password" type="password" required></div>
<div class="form-group"><label for="contact">Contact Number:</label><input id="contact" name="contact" type="tel" required></div>
<div class="form-group"><label for="age">Age:</label><input id="age" name="age" type="number" min="1" max="120"></div>
<div class="form-group"><label for="dob">Date of Birth:</label><input id="dob" name="dob" type="date"></div>
<div class="form-group"><label for="time">Appointment Time:</label><input id="time" name="time" type="time"></div>
<div class="form-group"><label for="datetime">Appointment Date &amp; Time:</label><input id="datetime" name="datetime" type="datetime-local"></div>
<div class="form-group"><label for="url">Personal Website/Reference:</label><input id="url" name="url" type="url"></div>
<div class="form-group"><label for="search">Search Doctor:</label><input id="search" name="search" type="search"></div>
<div class="form-group"><label for="color">Color:</label><input id="color" name="color" type="color"></div>
<div class="form-group"><label for="file">Upload File:</label><input id="file" name="file" type="file"></div>
<div class="form-group"><label for="range">Pain Level:</label><input id="range" name="range" type="range" min="0" max="10"></div>
<div class="form-group"><label>Gender:</label><span><label><input type="radio" name="gender" value="Male"> Male</label> <label><input type="radio" name="gender" value="Female"> Female</label></span></div>
<div class="form-group"><label>Known Allergies:</label><label><input type="checkbox" name="allergies" value="Yes"> Yes</label></div>
<div class="form-group"><label for="blood">Blood Group:</label><select id="blood" name="blood"><option>Select Blood Group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
<div class="form-group"><label for="address">Address:</label><textarea id="address" name="address" rows="3"></textarea></div>
<div class="buttons"><input type="submit" value="Submit"><input type="reset" value="Reset"><input type="image" src="../assets/payment-button.png" alt="Payment" width="100" height="40"></div>
</form></body></html>
