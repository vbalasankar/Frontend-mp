<!-- PDF source: pages 138-140; local responsive Bootstrap-style two-card layout -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Authentication</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/bootstrap-fallback.css">
<style>
body{background-color:#f0f8ff;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif}
.auth-card{background-color:#fff;border:1px solid #d0e4f7;border-radius:15px;box-shadow:0 10px 30px rgba(200,220,240,.5);transition:transform .3s ease}
.auth-card:hover{transform:translateY(-5px)}.card-title{color:#2b6cb0;font-weight:700}.btn-primary{background-color:#4a90e2;border:none;font-weight:600;padding:10px;color:#fff}.btn-primary:hover{background-color:#357abd}.form-control:focus{border-color:#4a90e2;box-shadow:0 0 0 .25rem rgba(74,144,226,.25)}
</style></head><body>
<div class="container my-5"><div class="row g-4 justify-content-center align-items-stretch">
<div class="col-md-6 col-lg-5 d-flex"><div class="card auth-card w-100 p-4 d-flex flex-column justify-content-between"><div class="card-body"><h3 class="card-title text-center mb-4">Login</h3><form><div class="mb-3"><label for="loginEmail" class="form-label">Username / Email</label><input type="email" class="form-control" id="loginEmail" required></div><div class="mb-3"><label for="loginPassword" class="form-label">Password</label><input type="password" class="form-control" id="loginPassword" required></div><button type="submit" class="btn btn-primary w-100 mt-2">Login</button></form></div></div></div>
<div class="col-md-6 col-lg-5 d-flex"><div class="card auth-card w-100 p-4 d-flex flex-column justify-content-between"><div class="card-body"><h3 class="card-title text-center mb-4">Register</h3><form><div class="mb-3"><label for="regName" class="form-label">Full Name</label><input type="text" class="form-control" id="regName" required></div><div class="mb-3"><label for="regEmail" class="form-label">Email</label><input type="email" class="form-control" id="regEmail" required></div><div class="mb-3"><label for="regPassword" class="form-label">Password</label><input type="password" class="form-control" id="regPassword" required></div><div class="mb-3"><label for="regConfirmPassword" class="form-label">Confirm Password</label><input type="password" class="form-control" id="regConfirmPassword" required></div><button type="submit" class="btn btn-primary w-100 mt-2">Register</button></form></div></div></div>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
