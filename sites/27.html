<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title><style>
body{font-family:Arial}.container{width:400px;margin:30px auto;padding:20px;border:1px solid black}h1{text-align:center}label{display:block;margin-top:10px}input[type=text],input[type=email]{width:100%;padding:7px;box-sizing:border-box;margin-top:5px}.option{width:auto}.error{color:red;font-size:14px}#output{margin-top:20px;color:green;font-weight:bold}button{padding:7px 15px;margin-top:15px}
</style></head><body><div class="container"><h1>Student Registration</h1><form id="studentForm" novalidate>
<label>Student Name</label><input type="text" id="name" placeholder="Enter student name"><div class="error" id="nameError"></div>
<label>Email ID</label><input type="email" id="email" placeholder="Enter email ID"><div class="error" id="emailError"></div>
<label>Gender</label><label><input class="option" type="radio" name="gender" value="Male"> Male</label><label><input class="option" type="radio" name="gender" value="Female"> Female</label><label><input class="option" type="radio" name="gender" value="Other"> Other</label><div class="error" id="genderError"></div>
<label>Skills</label><label><input class="option" type="checkbox" name="skills" value="HTML"> HTML</label><label><input class="option" type="checkbox" name="skills" value="CSS"> CSS</label><label><input class="option" type="checkbox" name="skills" value="JavaScript"> JavaScript</label><div class="error" id="skillsError"></div>
<button type="submit">Register</button> <button type="reset">Clear</button></form><div id="output"></div></div>
<script>
document.getElementById('studentForm').addEventListener('submit',function(e){e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),gender=document.querySelector('input[name="gender"]:checked'),skills=[...document.querySelectorAll('input[name="skills"]:checked')].map(x=>x.value);let ok=true;
const checks=[['nameError',/^[A-Za-z ]+$/.test(name),'Student name should contain only alphabets and spaces.'],['emailError',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email),'Enter a valid email address.'],['genderError',!!gender,'Please select a gender.'],['skillsError',skills.length>0,'Please select at least one skill.']];checks.forEach(([id,valid,msg])=>{document.getElementById(id).textContent=valid?'':msg;if(!valid)ok=false;});if(ok)document.getElementById('output').textContent='Registration Successful';});
document.getElementById('studentForm').addEventListener('reset',()=>{document.querySelectorAll('.error').forEach(x=>x.textContent='');document.getElementById('output').textContent='';});
</script></body></html>
